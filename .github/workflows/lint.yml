name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # the pinned release, not the distribution package: the same version the scripts are checked with before a
      # delivery, independent of what the runner image ships
      - name: shellcheck
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C /tmp
          /tmp/shellcheck-v0.11.0/shellcheck --version
          /tmp/shellcheck-v0.11.0/shellcheck -x scripts/*.sh drill/*.sh drill/devnet/*.sh

      - name: python syntax
        run: python3 -m py_compile drill/rpc-shim.py

      - name: compose config (host A)
        working-directory: node-a
        run: docker compose --env-file ../versions.lock --env-file ../profiles/demo.env --env-file .env.example config -q

      - name: compose config (host B)
        working-directory: node-b
        run: docker compose --env-file ../versions.lock --env-file ../profiles/lowcost.env --env-file .env.example config -q
      - name: compose config (host B with the kona override)
        working-directory: node-b
        run: docker compose -f docker-compose.yml -f docker-compose.kona.yml --env-file ../versions.lock --env-file ../profiles/lowcost.env --env-file .env.example config -q

      - name: compose config (devnet)
        working-directory: drill/devnet
        run: docker compose --env-file ../../versions.lock --env-file devnet.env config -q

      - name: json and schema
        run: |
          for f in manifests/*.json manifests/evidence/*.json registry/*.json; do jq empty "$f"; done
          python3 -m pip install -q --break-system-packages jsonschema 2>/dev/null || python3 -m pip install -q jsonschema
          python3 - <<'EOF'
          import json, jsonschema
          schema = json.load(open("manifests/manifest.schema.json"))
          doc = json.load(open("manifests/manifest.template.json"))
          jsonschema.validate(doc, schema)
          print("manifest template valid")
          EOF

      - name: no secrets committed
        run: |
          if git ls-files | grep -E '^(keys/|node-[ab]/secrets(\.[a-z0-9-]+)?/|\.env(\.[a-z0-9-]+)?$|node-[ab]/\.env(\.[a-z0-9-]+)?$)' | grep -v -E '(\.gitkeep|README\.md|\.env\.example)$'; then
            echo "secret paths are tracked"; exit 1; fi
          echo "ok"
