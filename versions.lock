# Finchain candidate version set (dotenv format; loaded by make and docker compose).
#
# STATUS: FROZEN 2026-11-12 (make lock on host A, darwin/arm64) after preflight on both
# hosts and the M1 and M2 runs passed with exactly this set. The digests are multi-arch
# index digests and resolve on amd64 and arm64 alike. Reasons for the chosen patch levels,
# including the Glamsterdam-driven changes, are in docs/versions.md. OP_DEPLOYER_SHA256 is
# the darwin/arm64 binary that performed the deployment.
#
# `make lock` rewrites the *_IMAGE values to immutable digests (image@sha256:...)
# and records the op-deployer binary checksum. Until then the tags below are
# mutable references.

# L1 contracts release (governance-approved) and the op-deployer release that targets it.
# The registry also lists v8.0.0 and v9.0.0 (docs/versions.md); the release choice is
# confirmed before freezing. The OPCM address is looked up from the registry by this tag.
OP_CONTRACTS_TAG=op-contracts/v7.0.0
OP_DEPLOYER_VERSION=v0.7.1

# Rollup services (container images). Sepolia runs Glamsterdam since 2026-10-06: L1 headers
# carry blockAccessListHash and slotNumber, so every service that reads L1 headers must be
# at a release that knows them (op-node >= v1.19.5, op-batcher >= v1.16.13,
# op-proposer >= v1.16.4, op-challenger >= v1.9.6; docs/versions.md). The batcher also
# needs the Amsterdam calldata floor (EIP-7976) in its gas limits: op-batcher >= v1.17.0.
OP_NODE_IMAGE=us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.19.11@sha256:e9eb72b7f13847a953fcf7d798814f128e2fdaa9edbc83bcffa0b7e6e9427c00
OP_RETH_IMAGE=us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:v2.4.2@sha256:01b4c25938cb08753e0a7ff7415d627cb566465eb618620d0586f0943fbeaf68
OP_BATCHER_IMAGE=us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:v1.17.2@sha256:80234d8cc116ca0574148e2e9a927d5b24f0ec18d74f48807982eb099eec7335
OP_PROPOSER_IMAGE=us-docker.pkg.dev/oplabs-tools-artifacts/images/op-proposer:v1.16.7@sha256:e56f448fd12d5a076805841fc9e24cb9c465a9a700ca37cef0fdc9a2518db90a
OP_CHALLENGER_IMAGE=us-docker.pkg.dev/oplabs-tools-artifacts/images/op-challenger:v1.9.6@sha256:4f01ba7d5f4e58d771534522e5624ab3e6e200d8be619a17e1b04c47548bdb93

# Fault-proof program source used to build the Finchain-embedding prestate (M4).
KONA_NODE_TAG=kona-node/v1.6.1

# Tooling
FOUNDRY_IMAGE=ghcr.io/foundry-rs/foundry:stable@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46
